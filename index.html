<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="İZODEKOR ERP statik arayüz önizlemesi">
  <title>İZODEKOR ERP — Önizleme</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      color: #273c4d;
      background: #edf2f5;
    }
    .wrap {
      width: min(410px, calc(100vw - 32px));
      padding: 38px;
      border: 1px solid #dfe7ec;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 22px 55px rgba(25, 51, 78, .07);
    }
    .mark {
      display: inline-flex;
      margin-bottom: 26px;
      padding: 13px;
      border-radius: 12px;
      color: #fff;
      background: #142743;
      font-weight: 800;
      letter-spacing: 1px;
    }
    h1 { margin: 0 0 8px; font-size: 28px; }
    .sub { margin-bottom: 24px; color: #76869a; font-size: 13px; }
    .notice {
      margin-bottom: 22px;
      padding: 11px 12px;
      border: 1px solid #d9e8e4;
      border-radius: 8px;
      color: #35645d;
      background: #f0f8f6;
      font-size: 12px;
      line-height: 1.45;
    }
    label { display: block; margin: 17px 0 8px; font-size: 12px; font-weight: 700; }
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d5dfe8;
      border-radius: 8px;
      font: inherit;
      background: #f8fafb;
    }
    button {
      width: 100%;
      margin-top: 23px;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      color: #fff;
      background: #20766f;
      font-weight: 800;
      opacity: .72;
      cursor: not-allowed;
    }
    .foot { margin-top: 25px; color: #94a1ae; font-size: 11px; text-align: center; }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="mark" aria-hidden="true">IZ</div>
    <h1>Tek merkezden yönetim.</h1>
    <p class="sub">İZODEKOR ERP · Arayüz önizlemesi</p>
    <div class="notice" role="note">
      Bu GitHub Pages yayını statik bir demodur. Güvenlik nedeniyle giriş ve ERP işlemleri devre dışıdır.
    </div>
    <form onsubmit="return false" aria-label="Devre dışı giriş önizlemesi">
      <label for="email">E-posta</label>
      <input id="email" type="email" disabled>
      <label for="password">Şifre</label>
      <input id="password" type="password" disabled>
      <button type="submit" disabled>Giriş Yap →</button>
    </form>
    <div class="foot">erp.izodekor.com.tr · Dahili operasyon sistemi</div>
  </main>
</body>
</html>
